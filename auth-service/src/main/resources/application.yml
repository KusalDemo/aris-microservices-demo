server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aris_demo}
    username: ${SPRING_DATASOURCE_USERNAME:aris}
    password: ${SPRING_DATASOURCE_PASSWORD:aris}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: auth_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:aris-demo-jwt-secret-change-me-32chars}
  issuer: ${JWT_ISSUER:aris-auth}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}

logging:
  level:
    com.aris: INFO
