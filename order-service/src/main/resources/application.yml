server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aris_demo}
    username: ${SPRING_DATASOURCE_USERNAME:aris}
    password: ${SPRING_DATASOURCE_PASSWORD:aris}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: order_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:aris-demo-jwt-secret-change-me-32chars}
  issuer: ${JWT_ISSUER:aris-auth}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}

aris:
  base-url: ${ARIS_BASE_URL:http://localhost:18080}
  decide-path: ${ARIS_DECIDE_PATH:/decide}
  connect-timeout-ms: ${ARIS_CONNECT_TIMEOUT_MS:500}
  read-timeout-ms: ${ARIS_READ_TIMEOUT_MS:1000}
  static-defaults:
    retry: ${ARIS_STATIC_RETRY:2}
    backoff-multiplier: ${ARIS_STATIC_BACKOFF_MULTIPLIER:1.5}
    timeout-ms: ${ARIS_STATIC_TIMEOUT_MS:1000}
  payment:
    charge-url: ${ARIS_PAYMENT_CHARGE_URL:http://payment-service/api/payments/charge}

logging:
  level:
    com.aris: INFO
